{{define "title"}}Two-factor · Lira{{end}}
{{define "content"}}
<div class="authcard">
  <h1 class="display">Enter your code</h1>
  <p class="muted">Open your authenticator app and enter the current 6-digit code. A recovery code works too.</p>
  <form method="post" action="/2fa/verify">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <label>Code
      <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="20" required autofocus>
    </label>
    <button type="submit" class="primary">Verify</button>
  </form>
  <form method="post" action="/logout" class="signout-mini">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <button type="submit" class="linklike">Sign out</button>
  </form>
</div>
{{end}}
