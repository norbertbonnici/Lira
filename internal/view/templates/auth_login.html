{{define "title"}}Sign in · Lira{{end}}
{{define "content"}}
<div class="authcard">
  <h1 class="display">Welcome back</h1>
  <p class="muted">Sign in to your household ledger.</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <label>Username
      <input name="username" autocomplete="username" value="{{with .Username}}{{.}}{{end}}" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary">Sign in</button>
  </form>
  {{if .CanRegister}}<p class="muted small">No account yet? <a href="/register">Register</a></p>{{end}}
</div>
{{end}}
